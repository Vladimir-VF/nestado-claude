<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">

<body>
<title>Нестадо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-screen 3D world, HUD on the edges, one dialog card at the bottom. One fixed warm look. */
:root{
  --ink:#2a2233;
  --paper:#fffdf6;
  --bee:#ffc53d;
  --bee-deep:#d39a12;
  --mint:#a8dcc8;
  --veil:rgba(42,34,51,.16);
  --font-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe3f0;color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--bee);outline-offset:2px}

#loading{position:fixed;inset:0;display:grid;place-items:center;background:#cfe3f0;z-index:30;transition:opacity .5s}
#loading div{display:flex;flex-direction:column;align-items:center;gap:14px}
#loading h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(34px,9vw,60px)}
#loading p{margin:0;font-weight:800;font-size:15px;opacity:.75}
#lbar{width:min(260px,70vw);height:12px;border-radius:6px;background:var(--paper);overflow:hidden;box-shadow:0 3px 0 var(--veil)}
#lbar i{display:block;height:100%;width:0;background:var(--bee);transition:width .2s}

#title{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 16px);text-align:center;pointer-events:none;transition:opacity .5s;padding:0 16px}
#title h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(32px,8vw,60px);text-shadow:0 3px 0 var(--paper)}
#title p{margin:4px 0 0;font-weight:800;font-size:15px}

.tag{position:fixed;transform:translate(-50%,0);background:var(--paper);border-radius:14px;padding:6px 11px;text-align:center;box-shadow:0 3px 0 var(--veil);pointer-events:auto;white-space:nowrap}
.tag b{display:block;font-family:var(--font-display);font-size:14px;font-weight:800}
.tag span{display:block;font-size:12px;font-weight:700;opacity:.7}

#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#herd{display:flex;gap:6px;pointer-events:auto;background:var(--paper);padding:6px;border-radius:18px;box-shadow:0 4px 0 var(--veil)}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border-radius:13px;padding:3px 4px 4px;font-weight:800;font-size:11px;min-width:54px}
.pc img{width:44px;height:44px;border-radius:50%;background:#eef6ea;display:block}
.pc.me{background:var(--bee)}
.pc em{position:absolute;top:0;right:2px;font-style:normal;font-size:11px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 1px 0 var(--veil)}
#jobsBtn{pointer-events:auto;background:var(--paper);padding:10px 13px;border-radius:14px;font-weight:800;font-size:13px;box-shadow:0 4px 0 var(--veil);white-space:nowrap}

#jobs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);right:max(10px,env(safe-area-inset-right,0px));width:min(330px,calc(100% - 20px));background:var(--paper);border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--veil);display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto}
#jobs h3{margin:0;font-family:var(--font-display);font-size:15px}
.job{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.job img{width:36px;height:36px;border-radius:50%;background:#eef6ea}
.job b{display:block;font-size:14px}
.job span{display:block;font-size:13px;font-weight:700;opacity:.8;line-height:1.35}
.job i{display:block;font-style:normal;font-size:12.5px;font-weight:700;line-height:1.4;margin-top:4px;padding:6px 8px;border-radius:10px;background:#f4efe0}

#say{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(560px,calc(100% - 24px));display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:22px;padding:12px 14px 12px 12px;box-shadow:0 5px 0 var(--veil);transition:opacity .3s, transform .3s;z-index:5}
#say.hide{opacity:0;transform:translateX(-50%) translateY(16px);pointer-events:none}
#say .who{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;gap:2px}
#say .who img,#say .who .beeface{width:50px;height:50px;border-radius:50%;background:#eef6ea}
#say .who small{font-weight:800;font-size:11px}
.beeface{background:repeating-linear-gradient(90deg,var(--bee) 0 9px,var(--ink) 9px 14px)!important;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
#stext{flex:1;font-weight:800;font-size:15.5px;line-height:1.38;min-width:0}
#snext{flex:0 0 auto;background:var(--bee);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--bee-deep)}

#acts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:4}
.act{background:var(--paper);border-radius:16px;padding:12px 15px;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--veil)}
.act.main{background:var(--bee);box-shadow:0 4px 0 var(--bee-deep)}

#joy{position:fixed;left:0;bottom:0;width:50%;height:62%;z-index:2}
#hintJoy{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 128px);width:84px;height:84px;border-radius:50%;border:3px dashed rgba(42,34,51,.35);display:grid;place-items:center;font-weight:800;font-size:11px;text-align:center;opacity:.8;pointer-events:none;z-index:2}

#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}

#final{position:fixed;inset:0;display:grid;place-items:center;background:rgba(42,34,51,.3);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:10}
#final .card{background:var(--paper);border-radius:26px;padding:20px;width:min(440px,100%);box-shadow:0 8px 0 var(--veil);display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
#final .top{display:flex;gap:14px;align-items:center}
#final .top img{width:84px;height:84px;border-radius:50%;background:#eef6ea;flex:0 0 84px}
#final h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.2;text-wrap:balance}
#final p{margin:0;font-weight:700;font-size:14.5px;line-height:1.42}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:8px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.bar b{display:block;height:12px;border-radius:6px;background:var(--veil);overflow:hidden}
.bar b u{display:block;height:100%;border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.cta{border-radius:14px;padding:11px 13px;font-weight:800;font-size:14px;background:var(--bee);box-shadow:0 4px 0 var(--bee-deep)}
.cta.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
#note{font-size:13px!important;opacity:.7}
@media (max-width:540px){
  .pc{min-width:46px;font-size:10px}.pc img{width:38px;height:38px}
  #stext{font-size:14.5px}
  #say .who{flex-basis:44px}#say .who img,#say .who .beeface{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){#fade,#say,#title,#loading{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="Світ Нестадо"></canvas>
<div id="loading"><div><h1>Нестадо</h1><p id="ltext">Корови прокидаються…</p><div id="lbar"><i></i></div></div></div>

  <div class="top"><img id="fImg" alt=""><h2 id="fTitle"></h2></div>

  <div class="row"><button class="cta ghost" id="fWalk" type="button">Гуляти далі</button><button class="cta ghost" id="fRestart" type="button">Почати з холодильника</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.js"></script>
<script>
(function(){
'use strict';
const V3=THREE.Vector3, $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), damp=(k,dt)=>1-Math.exp(-k*dt);
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
function rngFrom(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd=rngFrom(11);

/* ================= DATA: herd, lore, quests ================= */
const R=16;
function zdir(phi){const th=THREE.MathUtils.degToRad(60),ph=THREE.MathUtils.degToRad(phi);return new V3(Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)).normalize();}
const ZONES={
  sun:{name:'Сонячна галявина',short:'Сонце',dir:zdir(0),color:'#ffb703',
    top:'#6cc6ff',hor:'#dff4ff',fog:'#d8f0fb',hemiSky:'#fff4d6',hemiGround:'#7fb35a',sun:1.7,sunColor:'#fff1cf',grass:'#a7d86d'},
  dusk:{name:'Тихий вечір',short:'Вечір',dir:zdir(120),color:'#8e7cc3',
    top:'#3d3a7a',hor:'#f2b7a0',fog:'#b9a4cf',hemiSky:'#d9c8ff',hemiGround:'#4c6c66',sun:0.75,sunColor:'#ffb48a',grass:'#78a58f'},
  rain:{name:'Дощовий пагорб',short:'Дощик',dir:zdir(240),color:'#6f8fa6',
    top:'#7f93a6',hor:'#d6e0e6',fog:'#c3cfd6',hemiSky:'#e4edf3',hemiGround:'#5b7b66',sun:0.9,sunColor:'#eef4fa',grass:'#86b79a'},
};
const BASEZ={top:'#79cdf7',hor:'#e6f6fb',fog:'#e1f2f7',hemiSky:'#ffffff',hemiGround:'#7fb35c',sun:1.45,sunColor:'#ffffff',grass:'#9fd070'};
const PLAZA=new V3(0,1,0);
const HERD=[
  {key:'vilna',name:'Вільна',ins:'Вільною',acc:'Вільну',dat:'Вільній',gen:'Вільної',zone:'sun',tag:'не любить загорож',speed:1.12,
   lore:'Вільна пішла з першої загорожі зовсім маленькою. Не тому, що там було погано. Просто за загорожею росло більше квітів. Де вона пройде, там щось проростає.'},
  {key:'sonia',name:'Соня',ins:'Сонею',acc:'Соню',dat:'Соні',gen:'Соні',zone:'dusk',tag:'завжди трохи спить',speed:0.86,
   lore:'Соня спить не від лінощів. Вона просто вміє те, що інші забули: зупинитися. Поруч із нею навіть світлячки літають повільніше.'},
  {key:'pryima',name:'Прийма',ins:'Приймою',acc:'Прийму',dat:'Приймі',gen:'Прийми',zone:'rain',tag:'колюча, але своя',speed:1.0,
   lore:'Прийму знайшли під дощем маленьким колючим клубочком. Стадо взяло її до себе, і відтоді вона прийомна. Вона досі думає, що любов треба заслужити. Не треба.'},
];
const BYKEY={};HERD.forEach((h,i)=>{h.i=i;BYKEY[h.key]=h;});
const TEXT={
  vilna:{
    title:'Галявина для паростка',
    intro:['Привіт! Я Вільна. Бачиш паросток у мене на голові? Він сумує сам.','У траві ховаються три світлі зернятка. Знайди їх і принеси мені, посадимо цілу галявину!'],
    self:['Мій паросток сумує сам. Треба знайти йому друзів.','Десь у траві світяться три зернятка. Зберу їх і посаджу галявину вдома.'],
    prog:n=>'Ще '+n+' '+(n===1?'зернятко':'зернятка')+'. Вони люблять ховатися біля каміння й дерев.',
    done:['Дивись, як розквітло! Тепер тут ціла галявина.','Дякую. З тобою бігати веселіше, ніж самій.'],
  },
  sonia:{
    title:'Ліхтарик для Соні',
    intro:['Мммм... привіт... Я Соня.','Хочу поспати, але тут трохи темно і трохи страшно.','Зловиш пʼять світлячків для мого ліхтарика? Вони повільні, як я. Просто торкнись, і вони полетять за тобою.'],
    self:['Мммм... знову не спиться. Темно.','Якби зібрати пʼять світлячків у ліхтарик біля дому, стало б затишно.'],
    prog:n=>'Ще '+n+' '+(n===1?'світлячок':(n<5?'світлячки':'світлячків'))+'... можна не поспішати.',
    done:['Ох, який ліхтарик... тепер зовсім не страшно.','Знаєш, сон приходить до тих, хто дозволив собі відпочити. Добраніч... тобто гарного дня.'],
  },
  pryima:{
    title:'Парасолька і подружки',
    intro:['...Не підходь близько. У мене колючки.','Хоча... якщо вже прийшла. Тут постійно капає, я вся мокра.','На Сонячній галявині під великим деревом росте величезний лист. З нього вийде парасолька.'],
    self:['Знову дощ. І знову я сама під хмарою.','Під великим деревом на Сонячній галявині росте величезний лист. Може, з нього вийде парасолька.'],
    leaf:['Ти справді принесла. Мені ще ніхто не приносив парасольку.','А можна... ще одне? Тут самотньо. Приведи до мене обох подружок. Підійди до них і скажи «Ходімо зі мною».'],
    leafSelf:['Парасолька! Тепер сухо.','Але самотньо. Покличу подружок: підійду і скажу «Ходімо зі мною».'],
    prog1:'Шукаю великий лист під деревом на Сонячній галявині.',
    prog2:n=>n===1?'Ще одна подружка, і хмара, може, розійдеться.':'Приведи до Прийми обох подружок.',
    done:['Ви прийшли. Обидві.','Здається, колючки не для вас. Ой. Дощ скінчився. Дивіться, веселка!'],
  },
};

/* ================= renderer ================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const pmrem=new THREE.PMREMGenerator(renderer);
const envTex=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;
const U={time:{value:0}};

/* ================= sphere helpers ================= */
const tangentOf=(v,up)=>v.clone().sub(up.clone().multiplyScalar(v.dot(up)));
function anyTangent(up){const a=Math.abs(up.y)<0.95?new V3(0,1,0):new V3(1,0,0);return tangentOf(a,up).normalize();}
function orient(obj,up,fwd){let z=tangentOf(fwd,up);if(z.lengthSq()<1e-8)z=anyTangent(up);z.normalize();const x=new V3().crossVectors(up,z).normalize();obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,up,z));}
function randomNear(c,maxA,r){const t=anyTangent(c),b=new V3().crossVectors(c,t),a=Math.sqrt(r())*maxA,p=r()*Math.PI*2;return c.clone().multiplyScalar(Math.cos(a)).add(t.multiplyScalar(Math.sin(a)*Math.cos(p))).add(b.multiplyScalar(Math.sin(a)*Math.sin(p))).normalize();}
function ringAround(c,ang,phase){const t=anyTangent(c),b=new V3().crossVectors(c,t);return c.clone().multiplyScalar(Math.cos(ang)).add(t.multiplyScalar(Math.sin(ang)*Math.cos(phase))).add(b.multiplyScalar(Math.sin(ang)*Math.sin(phase))).normalize();}
function bump(u){return 0.35*Math.sin(u.x*4.1+1.3)*Math.sin(u.y*3.3+0.7)*Math.sin(u.z*3.7+2.1)+0.1*Math.sin(u.x*9+u.z*7)+0.25*Math.max(0,u.dot(PLAZA)-0.9)*10;}
const surf=(u,h)=>u.clone().multiplyScalar(R+bump(u)+(h||0));
const dist=(a,b)=>a.angleTo(b)*R;
function zoneWeights(u){const o={};for(const k in ZONES)o[k]=clamp((u.dot(ZONES[k].dir)-0.78)/(0.95-0.78),0,1);return o;}
function placeMatrix(u,yaw,s,sink){const f=anyTangent(u).applyAxisAngle(u,yaw);const x=new V3().crossVectors(u,f).normalize();const m=new THREE.Matrix4().makeBasis(x,u,f);m.scale(new V3(s,s,s));m.setPosition(surf(u,-(sink||0)));return m;}

/* ================= loading ================= */
const ASSETS=['cow_vilna','cow_sonia','cow_pryima','CommonTree_1','CommonTree_2','CommonTree_3','Pine_1','TwistedTree_1','Bush_Common','Bush_Common_Flowers','Flower_3_Group','Flower_4_Group','Clover_1','Clover_2','Grass_Common_Short','Grass_Wispy_Short','Mushroom_Common','Rock_Medium_1','Rock_Medium_2','Pebble_Round_1','Fern_1','Plant_1','RockPath_Round_Small_1'];
const G={};
function loadAll(){
  const loader=new THREE.GLTFLoader();if(window.MeshoptDecoder)loader.setMeshoptDecoder(MeshoptDecoder);let done=0;const failed=[];
  return Promise.all(ASSETS.map(n=>new Promise(res=>loader.load('assets/'+n+'.glb',g=>{G[n]=g;res();},undefined,e=>{failed.push(n);console.error('asset',n,e);res();}))
    .then(()=>{done++;$('lbar').firstElementChild.style.width=(done/ASSETS.length*100)+'%';}))).then(()=>{
    if(failed.some(n=>n.startsWith('cow_')))throw new Error(failed.join(', '));S.failed=failed;recolorLeaves();});
}
function recolorLeaves(){

  // leaf
  const qp=S.q.pryima;
  if(qp.st==='active'&&qp.step===0){if(leafObj.visible&&!S.carry.leaf&&dist(me.u,leafObj.userData.u)<1.3){S.carry.leaf=true;leafObj.visible=false;const l=leafObj.clone();l.visible=true;l.position.set(0,0,0);l.quaternion.identity();l.scale.setScalar(0.8);me.carry.add(l);S.leafCarrier=me;say(null,me.h.key==='pryima'?'Який лист! Тепер є парасолька.':'Який лист! Неси його '+BYKEY.pryima.dat+' на Дощовий пагорб.',2800);}
    if(S.carry.leaf&&!dlg){const pc=cows[BYKEY.pryima.i];if(me===pc||dist(me.u,pc.u)<2.6){qp.step=1;S.carry.leaf=false;const l=S.leafCarrier.carry.children[0];S.leafCarrier.carry.remove(l);l.scale.setScalar(1.25);l.position.set(0,0.75,0);pc.carry.add(l);dialog('pryima',me===pc?TEXT.pryima.leafSelf:TEXT.pryima.leaf);renderHerd();}}}
  if(qp.st==='active'&&qp.step===1&&!dlg&&pryimaFriends()>=2){finishQuest('pryima',TEXT.pryima.done);S.rainStop=true;}
}
function startFestival(){S.festival=true;cows.forEach(c=>{if(c.mode!=='player'){c.mode='gather';}});
  dialog(null,['Усі троє щасливі. Нестадо в зборі!','Ходімо на пагорб до холодильника. Там свято.']);}

/* ================= world entry ================= */
async function enterWorld(){await fade(1);S.scene='world';$('tags').innerHTML='';$('title').hidden=true;$('hud').hidden=false;
  cows.forEach(c=>{c.state='idle';c.hh=0;});const me=cows[S.chosen];S.ctl=S.chosen;me.mode='player';me.hh=10;me.vh=0;me.state='drop';S.busy=true;
  S.camHead.copy(me.f);S.camUp.copy(me.u);placeCam(true);renderHerd();if(touch){$('joy').hidden=false;$('hintJoy').hidden=false;}
  await fade(0);}
function fade(v){return new Promise(r=>{$('fade').style.opacity=v;setTimeout(r,reduced?30:470);});}
function landed(){S.busy=false;if(S.introDone)return;S.introDone=true;const me=HERD[S.ctl];
  dialog(null,['Ласкаво просимо в Нестадо! Тут ніхто не ходить строєм. Кожна корова пасеться там, де їй добре.',
    'Зараз ти '+me.name+'. '+(touch?'Ліва половина екрана це джойстик. Торкнись трави праворуч, щоб піти туди. Тягни праворуч, щоб крутити камеру.':'Стрілки або WASD, щоб іти. Клікни по траві, щоб піти туди. Тягни мишкою, щоб крутити камеру.'),
    'Подружки пасуться неподалік. Підійди до них, поговори, а можеш навіть стати кожною з них. Я покажу дорогу.'],()=>{selfQuestCheck(false);});}

/* ================= input ================= */
if(touch){const man=nipplejs.create({zone:$('joy'),mode:'dynamic',color:'#2a2233',size:110,restOpacity:0.6});
  man.on('move',(e,d)=>{const a=d.angle.radian,f=Math.min(1,d.distance/50);S.input.x=Math.cos(a)*f;S.input.y=Math.sin(a)*f;S.tapTarget=null;$('hintJoy').hidden=true;});
  man.on('end',()=>{S.input.x=0;S.input.y=0;});}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let drag=null;
function pick(x,y,objs){ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,S.scene==='fridge'?FC:WC);return ray.intersectObjects(objs,true)[0];}
canvas.addEventListener('pointerdown',e=>{canvas.focus();
  if(S.scene==='fridge'){const h=pick(e.clientX,e.clientY,fridgeCows.map(c=>c.root));if(h){const i=fridgeCows.findIndex(c=>{let o=h.object;while(o){if(o===c.root)return true;o=o.parent;}return false;});if(i>=0)chooseCow(i);}return;}
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>6||Math.abs(e.clientY-drag.y)>6)drag.moved=true;if(drag.moved){const me=cows[S.ctl];if(me)S.camHead.applyAxisAngle(me.u,-dx*0.006);drag.x=e.clientX;drag.y=e.clientY;}});
canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.moved&&S.scene==='world'&&!dlg){const hc=pick(e.clientX,e.clientY,cows.map(c=>c.root));
    if(hc){const c=cows.find(c=>{let o=hc.object;while(o){if(o===c.root)return true;o=o.parent;}return false;});if(c&&c.i!==S.ctl){S.tapTarget=c.u.clone();}}
    else{const h=pick(e.clientX,e.clientY,[planet]);if(h)S.tapTarget=h.point.clone().normalize();}}drag=null;});
canvas.addEventListener('pointercancel',()=>{drag=null;});
const KEYMAP={arrowup:'f',w:'f','ц':'f',arrowdown:'b',s:'b','і':'b','ы':'b',arrowleft:'l',a:'l','ф':'l',arrowright:'r',d:'r','в':'r'};
window.addEventListener('keydown',e=>{const k=KEYMAP[e.key.toLowerCase()];if(k){S.keys[k]=true;S.tapTarget=null;e.preventDefault();}if((e.key==='Enter'||e.key===' ')&&dlg){step();e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.key.toLowerCase()];if(k)S.keys[k]=false;});

/* ================= world update ================= */
function moveCow(c,dir,speed,dt){ // dir tangent unit or null
  const tv=dir?dir.clone().multiplyScalar(speed):new V3();c.vel.lerp(tv,damp(dir?7:9,dt));c.vel=tangentOf(c.vel,c.u);
  const sp=c.vel.length();if(sp>0.01){c.u.addScaledVector(c.vel,dt/R).normalize();c.f.lerp(c.vel.clone().normalize(),damp(9,dt));}
  for(const o of obstacles){const d=c.u.angleTo(o.u)*R,min=o.r+0.5;if(d<min){const away=tangentOf(c.u.clone().sub(o.u),c.u).normalize();c.u.addScaledVector(away,(min-d)/R).normalize();}}
  for(const o of cows){if(o===c)continue;const d=c.u.angleTo(o.u)*R;if(d<1.1&&d>1e-4){const away=tangentOf(c.u.clone().sub(o.u),c.u).normalize();c.u.addScaledVector(away,(1.1-d)*0.5/R).normalize();}}
  c.f=tangentOf(c.f,c.u).normalize();return sp;}
function animCow(c,sp,dt){c.phase+=dt*(4+sp*2.2);const hop=sp>0.25?Math.abs(Math.sin(c.phase))*0.16*Math.min(1,sp/3):0;
  const breathe=1+0.02*Math.sin(S.t*2+c.i);c.body.position.y=hop+c.hh;c.body.scale.set(1/Math.sqrt(breathe),breathe*(1-hop*0.25),1/Math.sqrt(breathe));
  const graze=c.state==='graze'?0.22:0;c.model.rotation.x+=(graze+(sp>0.25?0.06:0)-c.model.rotation.x)*damp(4,dt);c.model.rotation.z=sp>0.25?Math.sin(c.phase)*0.06:0;
  c.root.position.copy(surf(c.u));orient(c.root,c.u,c.f);}
function updateWorld(dt){const t=S.t;const me=cows[S.ctl];
  // drop-in
  cows.forEach(c=>{if(c.state==='drop'){c.vh-=24*dt;c.hh+=c.vh*dt;if(c.hh<=0){c.hh=0;if(c.vh<-4){c.vh=-c.vh*0.3;}else{c.vh=0;c.state='idle';landed();}}animCow(c,0,dt);}});
  // player
  if(me&&me.state!=='drop'){let dir=null,mag=0;const K=S.keys;const up=me.u,fw=tangentOf(S.camHead,up).normalize(),rt=new V3().crossVectors(fw,up).normalize();
    let ix=S.input.x,iy=S.input.y;if(K.f)iy=1;if(K.b)iy=-1;if(K.l)ix=-1;if(K.r)ix=1;
    if(!dlg&&(Math.abs(ix)>0.08||Math.abs(iy)>0.08)){dir=fw.clone().multiplyScalar(iy).add(rt.clone().multiplyScalar(ix));mag=Math.min(1,dir.length());dir.normalize();S.tapTarget=null;}
    else if(!dlg&&S.tapTarget){const d=dist(me.u,S.tapTarget);if(d<0.35)S.tapTarget=null;else{dir=tangentOf(S.tapTarget,up).normalize();mag=d<1.2?0.5:1;}}
    const sp=moveCow(me,dir,(dir?4.4*mag*me.h.speed:0),dt);S.moved+=sp*dt;animCow(me,sp,dt);me.state=sp>0.2?'walk':'idle';
    if(dir&&(S.tapTarget||Math.abs(ix)<0.5&&iy>0.3||S.keys.f)){S.camHead.lerp(me.f,damp(S.tapTarget?1.2:0.9,dt));}
    S.ctlTime[S.ctl]+=dt;if(S.onboard===0&&S.introDone&&!dlg&&S.moved>2){S.onboard=1;}
    if(!dlg&&S.introDone)selfQuestCheck(false);}
  // npcs
  cows.forEach(c=>{if(c===me||c.state==='drop')return;let dir=null,speed=0;
    if(c.mode==='follow'&&me){const behind=me.root.position.clone().addScaledVector(me.f,-1.6-0.9*cows.filter(o=>o.mode==='follow'&&o.i<c.i).length).normalize();const d=dist(c.u,behind);if(d>0.6){dir=tangentOf(behind,c.u).normalize();speed=Math.min(5.2,1.5+d*1.4);}}
    else if(c.mode==='gather'){const gp=ringAround(PLAZA,0.1,c.i*2.09+0.5);const d=dist(c.u,gp);if(d>0.4){dir=tangentOf(gp,c.u).normalize();speed=2.4;}}
    else{c.wander-=dt;if(c.wander<=0){c.wander=3+rnd()*5;c.target=rnd()<0.45?null:ringAround(c.home,0.03+rnd()*0.11,rnd()*6.28);}
      if(c.target){const d=dist(c.u,c.target);if(d>0.35){dir=tangentOf(c.target,c.u).normalize();speed=1.0*c.h.speed;}else c.target=null;}}
    const sp=moveCow(c,dir,speed,dt);c.state=sp>0.2?'walk':(c.mode==='graze'?'graze':'idle');animCow(c,sp,dt);
    c.emote-=dt;if(c.emote<=0){c.emote=3+rnd()*4;if(c.h.key==='sonia'&&S.q.sonia.st!=='done')emote(c,'z','#6c63a6');else if(S.q[c.h.key].st==='done')emote(c,'♥','#ff6b8a');else if(c.h.key==='pryima'&&!S.rainStop)emote(c,'…','#556');}
    if(c.carry.children.length&&c.h.key==='pryima'){c.carry.children[0].rotation.y+=dt*0.3;}});
  questTick(dt);
  // atmosphere
  if(me){const u=me.u,w=zoneWeights(u);let s=0;for(const k in w)s+=w[k];const k0=Math.max(0,1-s),norm=s>1?1/s:1;
    const mix=(key,out)=>{out.setRGB(0,0,0);const b=C(BASEZ[key]);out.r+=b.r*k0;out.g+=b.g*k0;out.b+=b.b*k0;for(const z in ZONES){let zc=C(ZONES[z][key]);if(z==='rain'&&S.rainStop&&(key==='top'||key==='hor'||key==='fog'))zc=C(key==='top'?'#7cc8f2':key==='hor'?'#f2f7e8':'#e3f1f2');out.r+=zc.r*w[z];out.g+=zc.g*w[z];out.b+=zc.b*w[z];}if(norm<1)out.multiplyScalar(norm);return out;};
    const tmp=new THREE.Color(),r=damp(2.2,dt);
    sky.material.uniforms.top.value.lerp(mix('top',tmp),r);sky.material.uniforms.hor.value.lerp(mix('hor',tmp),r);sky.material.uniforms.up.value.copy(S.camUp);
    WS.fog.color.lerp(mix('fog',tmp),r);hemi.color.lerp(mix('hemiSky',tmp),r);hemi.groundColor.lerp(mix('hemiGround',tmp),r);sun.color.lerp(mix('sunColor',tmp),r);
    let si=BASEZ.sun*k0;for(const z in ZONES)si+=(z==='rain'&&S.rainStop?1.4:ZONES[z].sun)*w[z];si*=norm;sun.intensity+=(si-sun.intensity)*r;
    sun.position.copy(me.root.position).addScaledVector(u,16).addScaledVector(anyTangent(u),7);sun.target.position.copy(me.root.position);sky.position.copy(WC.position);}
  if(S.rainStop){rainGroup.userData.rmat.opacity=Math.max(0,rainGroup.userData.rmat.opacity-dt*0.5);rainCloudMats.forEach(m=>{m.color.lerp(C('#ffffff'),damp(1,dt));m.opacity=Math.max(0.0,m.opacity-dt*0.12);});rainbow.children.forEach(m=>m.material.opacity=Math.min(0.85,m.material.opacity+dt*0.3));}
  // bee guide
  updateBee(dt);
  // festival
  if(S.festival&&me&&!S.finalShown&&dist(me.u,PLAZA)<3.4&&!dlg){S.finalShown=true;confetti();setTimeout(showFinal,1800);}
  placeCam(false,dt);refreshActs();
}
function beeGoal(){const me=cows[S.ctl];if(S.beeFocusT>0)return cows[S.beeFocus].u;if(S.festival)return PLAZA;
  const q=S.q;if(q.vilna.st==='active'){if(S.carry.seeds>0)return me.h.key==='vilna'?beds[0].g.position.clone().normalize():cows[BYKEY.vilna.i].u;const s=seeds.filter(s=>!s.got).sort((a,b)=>me.u.angleTo(a.u)-me.u.angleTo(b.u))[0];if(s)return s.u;}
  if(q.sonia.st==='active'){if(flies.some(f=>f.state==='follow'))return lantern.userData.u;const f=flies.filter(f=>f.state==='free').sort((a,b)=>me.u.angleTo(a.u)-me.u.angleTo(b.u))[0];if(f)return f.u;}
  if(q.pryima.st==='active'){if(q.pryima.step===0)return S.carry.leaf?cows[BYKEY.pryima.i].u:leafObj.userData.u;const nf=cows.find(c=>c.h.key!=='pryima'&&c!==me&&c.mode!=='follow');if(nf&&dist(nf.u,cows[BYKEY.pryima.i].u)>4)return nf.u;return cows[BYKEY.pryima.i].u;}
  const nn=cows.filter(c=>c!==me&&S.q[c.h.key].st==='new').sort((a,b)=>me.u.angleTo(a.u)-me.u.angleTo(b.u))[0];return nn?nn.u:null;}
function updateBee(dt){const me=cows[S.ctl];if(!me)return;S.beeFocusT=(S.beeFocusT||0)-dt;const u=me.u,p=me.root.position,t=S.t;const goal=beeGoal();let bt;
  if(goal&&dist(u,goal)>2.4){const d=tangentOf(goal,u).normalize();bt=p.clone().addScaledVector(u,2.3).addScaledVector(d,Math.min(3.2,dist(u,goal)*0.5+1.2));}
  else if(goal){bt=surf(goal,1.9);}
  else{bt=p.clone().addScaledVector(u,2.3).addScaledVector(anyTangent(u).applyAxisAngle(u,t*1.2),1.5);}
  bt.addScaledVector(u,0.22*Math.sin(t*3));const prev=wBee.position.clone();wBee.position.lerp(bt,damp(2.4,dt));const mv=wBee.position.clone().sub(prev);orient(wBee,u,mv.lengthSq()>1e-6?mv:me.f);flap(wBee,t);}
function placeCam(snap,dt){const me=cows[S.ctl];if(!me)return;const u=me.u;S.camHead=tangentOf(S.camHead,u).normalize();S.camUp.lerp(u,snap?1:damp(3,dt)).normalize();
  const portrait=innerWidth/innerHeight<0.8;const H=portrait?9.2:6.6,D=portrait?7.6:7.8;
  const want=me.root.position.clone().addScaledVector(u,H).addScaledVector(S.camHead,-D);if(snap)WC.position.copy(want);else WC.position.lerp(want,damp(me.state==='drop'?7:4,dt));
  WC.up.copy(S.camUp);WC.lookAt(me.root.position.clone().addScaledVector(u,0.8).addScaledVector(S.camHead,3.2));}
function confetti(){const me=cows[S.ctl];const cols=['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#ff8fab','#ffffff'];for(let k=0;k<70;k++){const m=new THREE.Mesh(new THREE.PlaneGeometry(0.16,0.1),new THREE.MeshBasicMaterial({color:C(cols[k%6]),side:THREE.DoubleSide,transparent:true}));
  const base=surf(PLAZA,3.2);m.position.copy(base);WS.add(m);const v=new V3(rnd()-0.5,rnd()*0.8+0.6,rnd()-0.5).normalize().multiplyScalar(4+rnd()*3);const st=S.t;
  anim.push(function f(t,dt){const k=t-st;v.addScaledVector(PLAZA,-6*dt);m.position.addScaledVector(v,dt);m.rotation.x+=dt*5;m.rotation.y+=dt*3;if(k>2.5)m.material.opacity=Math.max(0,1-(k-2.5));if(k>3.6){WS.remove(m);anim.splice(anim.indexOf(f),1);}});}
  cows.forEach(c=>{for(let k=0;k<3;k++)setTimeout(()=>emote(c,'♥','#ff6b8a'),k*300);});}

/* ================= final ================= */
function showFinal(){const tot=S.ctlTime.reduce((a,b)=>a+b,0)||1;let bi=0;S.ctlTime.forEach((v,i)=>{if(v>S.ctlTime[bi])bi=i;});const h=HERD[bi];
  $('fImg').src=PORTRAIT[h.key];$('fTitle').textContent='Сьогодні ти найбільше була '+h.ins+'.';$('fLore').textContent=h.lore;
  $('fBars').innerHTML=HERD.map((x,i)=>{const pc=Math.round(S.ctlTime[i]/tot*100);return '<div class="bar"><span>'+x.name+'</span><b><u style="width:'+pc+'%;background:'+ZONES[x.zone].color+'"></u></b><span>'+pc+'%</span></div>';}).join('');
  $('fText').textContent='Кожну корову Нестадо ліпить руками Неллі. '+h.name+' може жити у тебе на холодильнику, а можна попросити корову саме під твій стан.';
  $('fWant').textContent='Хочу '+h.acc+' на холодильник';$('note').hidden=true;$('final').hidden=false;refreshActs();}
S.showFinal=showFinal;
$('fWant').onclick=()=>{$('note').hidden=false;};$('fCustom').onclick=()=>{$('note').hidden=false;};
$('fWalk').onclick=()=>{$('final').hidden=true;say(null,'Гуляй скільки хочеш. Нестадо нікуди не поспішає.',3000);};
$('fRestart').onclick=()=>{location.hash='';location.reload();};

/* ================= resize & loop ================= */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);const portrait=w/h<0.8;FC.aspect=w/h;FC.position.set(0,0.3,portrait?17.5:11.5);FC.lookAt(0,0.1,0);FC.updateProjectionMatrix();WC.aspect=w/h;WC.fov=portrait?62:52;WC.updateProjectionMatrix();}
window.addEventListener('resize',resize);
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;S.t+=dt;U.time.value=S.t;
  if(S.scene==='fridge'){updateFridge(dt);renderer.render(FS,FC);}
  else if(S.scene==='world'){for(let k=anim.length-1;k>=0;k--)anim[k]&&anim[k](S.t,dt);updateWorld(dt);renderer.render(WS,WC);}
  requestAnimationFrame(frame);}

S.sim=(sec)=>{const n=Math.round(sec/0.05);for(let i=0;i<n;i++){S.t+=0.05;U.time.value=S.t;if(S.scene==='fridge'){updateFridge(0.05);}else if(S.scene==='world'){for(let k=anim.length-1;k>=0;k--)anim[k]&&anim[k](S.t,0.05);updateWorld(0.05);}}};
S.cows=()=>cows;S.dbg=()=>({seeds,flies,leafObj,lantern,beds});
/* ================= boot ================= */
loadAll().then(()=>{
  makePortraits();buildFridge();buildSky();buildPlanet();buildNature();buildZonesFX();
  HERD.forEach(h=>{const c=makeWorldCow(h);cows.push(c);WS.add(c.root);c.root.position.copy(surf(c.u));orient(c.root,c.u,c.f);});
  wBee=makeBee();wBee.scale.setScalar(0.4);WS.add(wBee);
  resize();S.scene='fridge';S.busy=false;$('title').hidden=false;$('loading').style.opacity=0;setTimeout(()=>{$('loading').hidden=true;},500);
  say(null,'Привіт! Я джміль. Торкнись корови, за яку почнеш.',0);
  requestAnimationFrame(frame);
}).catch(e=>{$('ltext').textContent='Не вдалося завантажити світ ('+e.message+'). Онови сторінку.';});
})();
